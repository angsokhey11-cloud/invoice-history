ortant;\n\n  padding:5px 8px!important;\n\n  border-bottom:1px solid #bfc7d1!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-summary-row.grand{\n  border-bottom:0!important;\n\n  background:#4472b9!important;\n\n  color:#fff!important;\n\n  font-size:15px!important;\n\n  font-weight:800!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-summary-row.credit{\n  color:#c56b00!important;\n\n  font-weight:700!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-summary-label{\n  font-weight:700!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-summary-value{\n  text-align:right!important;\n\n  white-space:nowrap!important;\n}\n\n\n/* =========================================================\n   PAYMENT / BANK / SIGNATURE\n   ========================================================= */\n\n#detailModal\n.bb-history-preview-stage\n.history-final-payment-box{\n  width:48%!important;\n\n  min-height:66px!important;\n\n  margin-top:14px!important;\n\n  padding:10px 12px!important;\n\n  border:1px solid #999!important;\n\n  font-size:12px!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-transaction-label{\n  margin-bottom:7px!important;\n\n  font-weight:800!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-bank{\n  min-height:54px!important;\n\n  margin-top:12px!important;\n\n  padding:9px 12px!important;\n\n  border:1px solid #999!important;\n\n  font-size:12px!important;\n\n  line-height:1.5!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-bank-title{\n  margin-bottom:3px!important;\n\n  font-weight:800!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-signature-grid{\n  display:grid!important;\n\n  grid-template-columns:\n    minmax(0,1fr)\n    minmax(0,1fr)\n    !important;\n\n  gap:42px!important;\n\n  margin-top:28px!important;\n\n  padding-top:4px!important;\n\n  font-size:12px!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-signature-column{\n  min-width:0!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-signature-name-row{\n  display:grid!important;\n\n  grid-template-columns:\n    auto\n    minmax(0,1fr)\n    !important;\n\n  gap:14px!important;\n\n  align-items:end!important;\n\n  min-height:24px!important;\n\n  padding-bottom:6px!important;\n\n  border-bottom:1px solid #777!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-signature-label{\n  font-weight:800!important;\n\n  white-space:nowrap!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-signature-value{\n  min-width:0!important;\n\n  overflow-wrap:anywhere!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-signature-line{\n  margin-top:14px!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-signature-line-title{\n  margin-bottom:7px!important;\n\n  font-weight:800!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-signature-blank{\n  height:30px!important;\n\n  border-bottom:1px solid #777!important;\n}\n\n#detailModal\n.bb-history-preview-stage\n.history-final-footer-space{\n  height:8px!important;\n}\n\n\n/* =========================================================\n   ACTION BUTTONS\n   ========================================================= */\n\n#detailModal .history-invoice-actions{\n  position:sticky!important;\n\n  bottom:0!important;\n\n  z-index:30!important;\n\n  display:grid!important;\n\n  grid-template-columns:\n    repeat(3,minmax(0,1fr))\n    !important;\n\n  gap:5px!important;\n\n  padding:\n    7px\n    6px\n    calc(8px + env(safe-area-inset-bottom))\n    !important;\n\n  border-top:1px solid #d7e0ea!important;\n\n  background:rgba(238,242,247,.98)!important;\n\n  backdrop-filter:blur(8px)!important;\n}\n\n#detailModal .history-action-btn{\n  min-height:42px!important;\n\n  padding:5px 3px!important;\n\n  border-radius:9px!important;\n\n  font-size:8px!important;\n\n  line-height:1.15!important;\n\n  white-space:normal!important;\n}\n\n\n/* =========================================================\n   SMALLER PHONES\n   ========================================================= */\n\n@media(max-width:390px){\n\n  .main{\n    padding:6px 6px 16px!important;\n  }\n\n  .filter-grid{\n    gap:6px!important;\n  }\n\n  .field input,\n  .field select{\n    height:38px!important;\n\n    font-size:10px!important;\n  }\n\n  #invoiceBody > tr{\n    padding:8px!important;\n\n    column-gap:5px!important;\n\n    row-gap:5px!important;\n  }\n\n  #invoiceBody > tr > td:nth-child(1) .invoice-link,\n  #invoiceBody > tr > td:nth-child(3){\n    font-size:12px!important;\n  }\n\n  #invoiceBody > tr > td:nth-child(8),\n  #invoiceBody > tr > td:nth-child(9),\n  #invoiceBody > tr > td:nth-child(10){\n    padding:6px 5px!important;\n\n    font-size:9.5px!important;\n  }\n\n  #detailModal .history-action-btn{\n    font-size:7.2px!important;\n  }\n}\n\n`;\n\n\n/* =========================================================\n   ADD MOBILE CSS\n   ========================================================= */\n\nfunction addMobileStyle(doc){\n\n  let style =\n    doc.getElementById(\n      'bb-mobile-invoices-skin'\n    );\n\n  if(!style){\n\n    style =\n      doc.createElement('style');\n\n    style.id =\n      'bb-mobile-invoices-skin';\n\n    doc.head.appendChild(style);\n  }\n\n  style.textContent =\n    MOBILE_CSS;\n}\n\n\n/* =========================================================\n   FILTER BOTTOM SHEET\n   ========================================================= */\n\nfunction enhanceFilters(doc){\n\n  const filters =\n    doc.querySelector('.filters');\n\n  const summary =\n    doc.querySelector('.summary');\n\n  if(!filters || !summary){\n    return;\n  }\n\n\n  let backdrop =\n    doc.getElementById(\n      'bbInvoiceFilterBackdrop'\n    );\n\n  if(!backdrop){\n\n    backdrop =\n      doc.createElement('div');\n\n    backdrop.id =\n      'bbInvoiceFilterBackdrop';\n\n    backdrop.className =\n      'bb-invoice-filter-backdrop';\n\n    doc.body.appendChild(backdrop);\n  }\n\n\n  if(\n    !filters.querySelector(\n      '.bb-mobile-filter-head'\n    )\n  ){\n\n    const head =\n      doc.createElement('div');\n\n    head.className =\n      'bb-mobile-filter-head';\n\n    head.innerHTML = `\n      \u003cdiv>\n        \u003cstrong>Filter Invoices\u003c/strong>\n        \u003cspan>\n          Invoice, customer, location,\n          date and type\n        \u003c/span>\n      \u003c/div>\n\n      \u003cbutton\n        type=\"button\"\n        class=\"bb-mobile-filter-close\"\n        aria-label=\"Close filters\">\n        ×\n      \u003c/button>\n    `;\n\n    filters.insertBefore(\n      head,\n      filters.firstChild\n    );\n  }\n\n\n  let trigger =\n    doc.getElementById(\n      'bbMobileInvoiceFilterTrigger'\n    );\n\n  if(!trigger){\n\n    trigger =\n      doc.createElement('button');\n\n    trigger.type =\n      'button';\n\n    trigger.id =\n      'bbMobileInvoiceFilterTrigger';\n\n    trigger.className =\n      'bb-mobile-filter-trigger';\n\n    trigger.innerHTML =\n      '☷ \u003cspan>Filters\u003c/span>';\n\n    summary.appendChild(trigger);\n  }\n\n\n  const open = () => {\n\n    filters.classList.add(\n      'bb-mobile-open'\n    );\n\n    backdrop.classList.add(\n      'show'\n    );\n  };\n\n\n  const close = () => {\n\n    filters.classList.remove(\n      'bb-mobile-open'\n    );\n\n    backdrop.classList.remove(\n      'show'\n    );\n  };\n\n\n  trigger.onclick =\n    open;\n\n  backdrop.onclick =\n    close;\n\n\n  const closeBtn =\n    filters.querySelector(\n      '.bb-mobile-filter-close'\n    );\n\n  if(closeBtn){\n    closeBtn.onclick = close;\n  }\n\n\n  [\n    ...filters.querySelectorAll(\n      '.filter-grid > .btn'\n    )\n  ].forEach(btn => {\n\n    if(\n      btn.dataset\n        .bbMobileCloseBound\n    ){\n      return;\n    }\n\n    btn.dataset\n      .bbMobileCloseBound = '1';\n\n    btn.addEventListener(\n      'click',\n      () => {\n        setTimeout(\n          close,\n          80\n        );\n      }\n    );\n  });\n}\n\n\n/* =========================================================\n   MOBILE INVOICE CARDS\n   ========================================================= */\n\nfunction polishRows(doc){\n\n  const body =\n    doc.getElementById(\n      'invoiceBody'\n    );\n\n  if(!body){\n    return;\n  }\n\n\n  body\n    .querySelectorAll(\n      ':scope > tr'\n    )\n    .forEach(tr => {\n\n      tr.classList.toggle(\n        'bb-empty-row',\n        !!tr.querySelector(\n          'td.empty'\n        )\n      );\n\n\n      const cells =\n        tr.children;\n\n      if(cells.length \u003c 12){\n        return;\n      }\n\n\n      const action =\n        cells[11]\n          .querySelector(\n            '.action-menu-btn'\n          );\n\n      const link =\n        cells[0]\n          .querySelector(\n            '.invoice-link'\n          );\n\n\n      if(\n        action &&\n        link &&\n        !action.dataset.bbMobileDirect\n      ){\n\n        action.dataset\n          .bbMobileDirect = '1';\n\n        action.textContent =\n          'View ›';\n\n        action.removeAttribute(\n          'onclick'\n        );\n\n        action.onclick =\n          event => {\n\n            event.preventDefault();\n            event.stopPropagation();\n\n            link.click();\n          };\n      }\n    });\n}\n\n\n/* =========================================================\n   FIT ORIGINAL INVOICE TO PHONE\n   ========================================================= */\n\nfunction fitInvoicePreview(doc){\n\n  const modal =\n    doc.getElementById(\n      'detailModal'\n    );\n\n  if(\n    !modal ||\n    !modal.classList.contains('show')\n  ){\n    return;\n  }\n\n\n  const wrap =\n    modal.querySelector(\n      '.history-invoice-wrap'\n    );\n\n  const invoice =\n    modal.querySelector(\n      '.history-final-invoice'\n    );\n\n  if(!wrap || !invoice){\n    return;\n  }\n\n\n  let stage =\n    wrap.querySelector(\n      '.bb-history-preview-stage'\n    );\n\n\n  if(!stage){\n\n    stage =\n      doc.createElement('div');\n\n    stage.className =\n      'bb-history-preview-stage';\n\n    invoice.parentNode\n      .insertBefore(\n        stage,\n        invoice\n      );\n\n    stage.appendChild(invoice);\n\n  }else if(\n    invoice.parentNode !== stage\n  ){\n\n    stage.appendChild(invoice);\n  }\n\n\n  const BASE_WIDTH = 794;\n\n\n  const availableWidth =\n    Math.max(\n      260,\n      wrap.clientWidth\n    );\n\n\n  const scale =\n    Math.min(\n      1,\n      availableWidth / BASE_WIDTH\n    );\n\n\n  stage.style.setProperty(\n    '--bb-invoice-scale',\n    String(scale)\n  );\n\n\n  /*\n   * offsetHeight is the original\n   * unscaled 794px invoice height.\n   */\n  const naturalHeight =\n    Math.max(\n      invoice.offsetHeight,\n      invoice.scrollHeight,\n      1\n    );\n\n\n  stage.style.height =\n    Math.ceil(\n      naturalHeight * scale\n    ) + 'px';\n\n\n  stage.style.width =\n    Math.ceil(\n      BASE_WIDTH * scale\n    ) + 'px';\n\n\n  stage.style.marginLeft =\n    'auto';\n\n  stage.style.marginRight =\n    'auto';\n}\n\n\n/* =========================================================\n   WATCH INVOICE PREVIEW\n   ========================================================= */\n\nfunction watchDetail(doc){\n\n  const modal =\n    doc.getElementById(\n      'detailModal'\n    );\n\n  if(\n    !modal ||\n    modal.dataset.bbMobileWatch\n  ){\n    return;\n  }\n\n\n  modal.dataset\n    .bbMobileWatch = '1';\n\n\n  const childWindow =\n    frame.contentWindow;\n\n\n  let fitTimer = null;\n\n\n  const runFit = () => {\n\n    clearTimeout(fitTimer);\n\n    fitTimer =\n      setTimeout(\n        () => {\n\n          childWindow\n            .requestAnimationFrame(\n              () => {\n\n                fitInvoicePreview(doc);\n\n                const content =\n                  doc.getElementById(\n                    'detailContent'\n                  );\n\n                if(content){\n                  content.scrollTop = 0;\n                }\n              }\n            );\n\n        },\n        45\n      );\n  };\n\n\n  /*\n   * Modal open / close\n   */\n  new childWindow\n    .MutationObserver(\n      () => {\n\n        if(\n          modal.classList\n            .contains('show')\n        ){\n\n          runFit();\n\n          setTimeout(\n            () =>\n              fitInvoicePreview(doc),\n            180\n          );\n\n          setTimeout(\n            () =>\n              fitInvoicePreview(doc),\n            500\n          );\n        }\n      }\n    )\n    .observe(\n      modal,\n      {\n        attributes:true,\n        attributeFilter:[\n          'class'\n        ]\n      }\n    );\n\n\n  /*\n   * Invoice HTML gets rebuilt\n   * after invoice detail loads.\n   */\n  const printArea =\n    doc.getElementById(\n      'historyInvoicePrintArea'\n    );\n\n  if(printArea){\n\n    new childWindow\n      .MutationObserver(\n        () => {\n\n          if(\n            modal.classList\n              .contains('show')\n          ){\n\n            runFit();\n\n            setTimeout(\n              () =>\n                fitInvoicePreview(doc),\n              120\n            );\n          }\n        }\n      )\n      .observe(\n        printArea,\n        {\n          childList:true,\n          subtree:true\n        }\n      );\n  }\n\n\n  /*\n   * Detail loading state change\n   */\n  const detailContent =\n    doc.getElementById(\n      'detailContent'\n    );\n\n  if(detailContent){\n\n    new childWindow\n      .MutationObserver(\n        runFit\n      )\n      .observe(\n        detailContent,\n        {\n          attributes:true,\n          childList:true,\n          subtree:true\n        }\n      );\n  }\n\n\n  childWindow\n    .addEventListener(\n      'resize',\n      () => {\n\n        fitInvoicePreview(doc);\n      }\n    );\n}\n\n\n/* =========================================================\n   WATCH INVOICE LIST\n   ========================================================= */\n\nfunction observeRows(doc){\n\n  const body =\n    doc.getElementById(\n      'invoiceBody'\n    );\n\n  if(\n    !body ||\n    body.dataset.bbMobileObserved\n  ){\n    return;\n  }\n\n\n  body.dataset\n    .bbMobileObserved = '1';\n\n\n  new frame.contentWindow\n    .MutationObserver(\n      () => {\n\n        frame.contentWindow\n          .requestAnimationFrame(\n            () => {\n\n              polishRows(doc);\n            }\n          );\n      }\n    )\n    .observe(\n      body,\n      {\n        childList:true,\n        subtree:true\n      }\n    );\n}\n\n\n/* =========================================================\n   INJECT MOBILE SKIN\n   ========================================================= */\n\nfunction inject(){\n\n  let doc;\n\n  try{\n\n    doc =\n      frame.contentDocument ||\n      frame.contentWindow.document;\n\n  }catch(error){\n\n    return;\n  }\n\n\n  if(\n    !doc ||\n    !doc.head ||\n    !doc.body\n  ){\n    return;\n  }\n\n\n  addMobileStyle(doc);\n\n  enhanceFilters(doc);\n\n  polishRows(doc);\n\n  observeRows(doc);\n\n  watchDetail(doc);\n\n\n  setTimeout(\n    () => {\n\n      polishRows(doc);\n\n      fitInvoicePreview(doc);\n\n    },\n    120\n  );\n\n\n  setTimeout(\n    () => {\n\n      polishRows(doc);\n\n      fitInvoicePreview(doc);\n\n    },\n    600\n  );\n\n\n  boot.classList.add(\n    'hide'\n  );\n}\n\n\n/* =========================================================\n   LOAD\n   ========================================================= */\n\nframe.addEventListener(\n  'load',\n  () => {\n\n    setTimeout(\n      inject,\n      80\n    );\n\n    setTimeout(\n      inject,\n      450\n    );\n\n    setTimeout(\n      inject,\n      1200\n    );\n  }\n);\n\n})();\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n";
  document.open();
