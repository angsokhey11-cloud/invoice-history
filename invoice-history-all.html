<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Invoice History All Locations</title>
<style>html,body{margin:0;min-height:100%;background:#eef3f8;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Invoice History…<div class="bb-sub">All locations · permission controlled</div></div></div>
<script>
(async function(){
  try{
    const r=await fetch('legacy-google-v4.6.3.html?v=20261001-creditdigitalfix3',{cache:'no-store'});
    if(!r.ok)throw new Error('Could not load Invoice History source.');
    let html=await r.text();

    const mobileScope=new URLSearchParams(location.search).get('mobileScope')==='1';
    const adapterFile=mobileScope
      ? 'supabase-history-mobile-adapter.js?v=20260926-addproduct1'
      : 'supabase-history-all-adapter.js?v=20260924-sheetsync1';
    const adapterObject=mobileScope
      ? 'BBHistoryMobileAdapter'
      : 'BBHistoryAllAdapter';
    const adapter='<scr'+'ipt src="'+adapterFile+'"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Invoice History source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    const marker='(async function initializeInvoiceHistory() {';
    const replacement=`${marker}
      try {
        // Initializing Invoice History must wait for its external adapter.
        let adapter=null;
        for(let i=0;i<60;i++){
          adapter=window[${JSON.stringify(adapterObject)}];
          if(adapter?.fetchApi)break;
          await new Promise(resolve=>setTimeout(resolve,150));
        }
        if(!adapter?.fetchApi)throw Error("Invoice History database connection did not initialize.");
        fetchApi=adapter.fetchApi;
        historyJsonp=adapter.historyJsonp;
        postHistoryAction=adapter.postHistoryAction;
        requireHistoryPrimaryAdmin=adapter.requirePrimaryAdmin;
        const originalMasterLookup=historyJsonp;
        historyJsonp=async function(url,params){
          if(params?.action!=="getLocations")return originalMasterLookup(url,params);
          // A slow auxiliary location dropdown must not block the invoice list.
          return Promise.race([originalMasterLookup(url,params),
            new Promise(resolve=>setTimeout(()=>resolve([]),9000))]);
        };
      `;
    if(!html.includes(marker))throw new Error('Invoice History initialization marker was not found.');
    html=html.replace(marker,replacement);
    const initTail='    startHistorySmartSync();\n  })();';
    if(!html.includes(initTail))throw Error('Invoice History final initialization marker missing.');
    html=html.replace(initTail,
      '    startHistorySmartSync();\n  } catch(error) { console.error("Invoice History startup:",error);'+
      ' const message=String(error?.message||error);'+
      ' const loader=document.getElementById("loading");'+
      ' if(loader)loader.textContent="Cannot load invoices: "+message;'+
      ' const table=document.getElementById("invoiceBody");'+
      ' if(table)table.innerHTML=\'<tr><td colspan="13" class="empty">Could not load Invoice History. Press Search to retry.</td></tr>\';'+
      ' } })();'
    );


    html=html.replaceAll('Sales Database','BIG BROTHER Database');
    html=html.replace('<title>BIG BROTHER — Invoice History Workspace</title>','<title>BIG BROTHER — Invoice History</title>');

    // Credit invoices only: show the Digital Original action after a fresh
    // server check. No button appears on cash/bank or paid invoice previews.
    const detailAction='<button type="button" class="history-action-btn history-save-btn" id="bbSaveDigitalOriginal" hidden onclick="window.BBDigitalOriginal.save()">📄 Save as Digital Original</button><span id="bbDigitalOriginalBadge" hidden style="padding:8px 10px;border-radius:8px;background:#ecf8f0;color:#207148;font-size:12px;font-weight:800"></span>';
    const actionAnchor='<button type="button" class="history-action-btn history-telegram-btn" onclick="shareHistoryInvoiceToTelegram(event)">✈️ Share to Telegram</button>';
    if(!html.includes(actionAnchor))throw Error('Invoice preview action anchor not found');
    html=html.replace(actionAnchor,actionAnchor+detailAction);
    html=html.replace('</head>','<style>#bbSaveDigitalOriginal[hidden],#bbDigitalOriginalBadge[hidden]{display:none!important}#bbDigitalOriginalBadge{grid-column:1/-1}.history-invoice-actions:has(#bbSaveDigitalOriginal:not([hidden])){grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}@media(max-width:600px){.history-invoice-actions:has(#bbSaveDigitalOriginal:not([hidden])){grid-template-columns:1fr}}</style></head>');



    // The print-preview HTML also contains a literal </body> in a template.
    // Insert at the document's LAST closing body tag, never inside its scripts.
    const finalBodyClose=html.toLowerCase().lastIndexOf('</body>');
    if(finalBodyClose<0)throw Error('Invoice History document body closing tag missing.');
    html=html.slice(0,finalBodyClose)
      +'<scr'+'ipt src="history-digital-original-v1.js?v=20261001-creditdigitalfix4"></scr'+'ipt>'
      +html.slice(finalBodyClose);
    // Desktop-only fitted preview. Keep the original A4 document unchanged.
    if(!mobileScope){
    const fitBody=html.toLowerCase().lastIndexOf('</body>');
    if(fitBody<0)throw Error('Invoice History body closing tag missing for preview fit.');
    html=html.slice(0,fitBody)
      +'<scr'+'ipt src="history-desktop-fit-preview-v1.js?v=20261002-headerbig2"></scr'+'ipt>'
      +html.slice(fitBody);
    }
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Invoice History<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body></html>
