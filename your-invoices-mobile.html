<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Your Invoices Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif}
#invoiceFrame{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f7fb;color:#17457a;font-weight:800;z-index:5}
#boot.hide{display:none}
</style>
</head>
<body>
<div id="boot">Loading Your Invoices…</div>
<iframe id="invoiceFrame" src="your-invoices.html?embed=1&mobileSkin=1&v=20260914-2" title="Your Invoices"></iframe>
<script>
(function(){
'use strict';
const frame=document.getElementById('invoiceFrame');
const boot=document.getElementById('boot');
const MOBILE_CSS=`
:root{--bb-blue:#1768d5;--bb-navy:#123f78;--bb-bg:#f4f7fb;--bb-line:#dfe7f0;--bb-text:#18324e;--bb-muted:#6d7e92;--bb-red:#d73545;--bb-green:#159a5b;--bb-amber:#b57500}
html,body{background:var(--bb-bg)!important;overflow-x:hidden!important}
body{min-width:0!important}
.main{margin:0!important;width:100%!important;max-width:none!important;padding:8px 8px 18px!important}
.topbar{display:none!important}
#errorBox{margin:0 0 7px!important;padding:8px 10px!important;border-radius:9px!important;font-size:10px!important}
.summary{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;margin:0 1px 8px!important;min-height:38px!important}
.summary-count{font-size:11px!important;color:#526b84!important;font-weight:900!important}
.loading{font-size:9px!important}
.bb-mobile-filter-trigger{border:1px solid #cbd8e7;background:#fff;color:var(--bb-navy);border-radius:9px;min-height:36px;padding:7px 11px;font-size:10px;font-weight:900;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 7px rgba(23,63,119,.04)}
.filters{position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;z-index:3001!important;margin:0!important;padding:10px 10px calc(12px + env(safe-area-inset-bottom))!important;border:1px solid var(--bb-line)!important;border-radius:18px 18px 0 0!important;background:#fff!important;box-shadow:0 -18px 48px rgba(18,50,86,.18)!important;transform:translateY(110%)!important;transition:transform .22s ease!important;max-height:88dvh!important;overflow:auto!important}
.filters.bb-mobile-open{transform:translateY(0)!important}
.bb-invoice-filter-backdrop{display:none;position:fixed;inset:0;z-index:3000;background:rgba(9,27,48,.54)}
.bb-invoice-filter-backdrop.show{display:block}
.bb-mobile-filter-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 1px 10px;margin-bottom:8px;border-bottom:1px solid var(--bb-line)}
.bb-mobile-filter-head strong{font-size:17px;color:var(--bb-navy)}
.bb-mobile-filter-head span{display:block;margin-top:2px;color:var(--bb-muted);font-size:9px}
.bb-mobile-filter-close{width:34px;height:34px;border:0;border-radius:50%;background:#edf2f8;color:var(--bb-navy);font-size:20px;font-weight:900}
.filter-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;align-items:end!important}
.filter-grid .field{min-width:0!important}
.field label{margin-bottom:4px!important;font-size:8.5px!important;line-height:1!important;text-transform:uppercase!important;letter-spacing:.25px!important;color:#536b84!important}
.field input,.field select{width:100%!important;min-width:0!important;height:40px!important;border-radius:9px!important;padding:0 9px!important;font-size:11px!important;background:#fff!important}
.filter-grid>.btn{width:100%!important;height:40px!important;border-radius:9px!important;font-size:10px!important;padding:0 8px!important}
.filter-grid>.btn-primary{grid-column:2!important;grid-row:auto!important}
.filter-grid>.btn-secondary{grid-column:1!important;grid-row:auto!important}
.table-card{border:0!important;background:transparent!important;box-shadow:none!important;overflow:visible!important}
.table-card>.table-wrap{overflow:visible!important}
.table-card table{display:block!important;width:100%!important;min-width:0!important;border-collapse:separate!important}
.table-card thead{display:none!important}
#invoiceBody{display:grid!important;gap:8px!important;width:100%!important}
#invoiceBody>tr{display:grid!important;grid-template-columns:minmax(0,1fr) auto auto!important;grid-template-areas:'invoice status action' 'customer customer customer' 'date location salesperson' 'payment currency currency' 'grand paid outstanding'!important;column-gap:7px!important;row-gap:6px!important;align-items:center!important;padding:10px!important;border:1px solid var(--bb-line)!important;border-radius:13px!important;background:#fff!important;box-shadow:0 2px 8px rgba(23,63,119,.045)!important;overflow:hidden!important}
#invoiceBody>tr>td{display:block!important;min-width:0!important;padding:0!important;border:0!important;background:transparent!important;font-size:9.5px!important;line-height:1.2!important;white-space:normal!important}
#invoiceBody>tr>td:nth-child(1){grid-area:invoice!important;align-self:center!important}
#invoiceBody>tr>td:nth-child(1) .invoice-link{display:block!important;font-size:13px!important;font-weight:900!important;color:var(--bb-navy)!important;text-decoration:none!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#invoiceBody>tr>td:nth-child(2){grid-area:date!important;color:#60758c!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#invoiceBody>tr>td:nth-child(2)::before{content:'Date ';font-size:7px;font-weight:900;color:#8190a1;display:block;margin-bottom:2px;text-transform:uppercase}
#invoiceBody>tr>td:nth-child(3){grid-area:customer!important;font-size:13px!important;font-weight:900!important;color:var(--bb-text)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;padding-top:1px!important}
#invoiceBody>tr>td:nth-child(4){grid-area:location!important;color:#60758c!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#invoiceBody>tr>td:nth-child(4)::before{content:'Location ';font-size:7px;font-weight:900;color:#8190a1;display:block;margin-bottom:2px;text-transform:uppercase}
#invoiceBody>tr>td:nth-child(5){grid-area:salesperson!important;color:#60758c!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#invoiceBody>tr>td:nth-child(5)::before{content:'Salesperson ';font-size:7px;font-weight:900;color:#8190a1;display:block;margin-bottom:2px;text-transform:uppercase}
#invoiceBody>tr>td:nth-child(6){grid-area:payment!important;color:#60758c!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#invoiceBody>tr>td:nth-child(6)::before{content:'Payment ';font-size:7px;font-weight:900;color:#8190a1;display:block;margin-bottom:2px;text-transform:uppercase}
#invoiceBody>tr>td:nth-child(7){grid-area:currency!important;color:#60758c!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#invoiceBody>tr>td:nth-child(7)::before{content:'Currency ';font-size:7px;font-weight:900;color:#8190a1;display:block;margin-bottom:2px;text-transform:uppercase}
#invoiceBody>tr>td:nth-child(8){grid-area:grand!important}
#invoiceBody>tr>td:nth-child(9){grid-area:paid!important}
#invoiceBody>tr>td:nth-child(10){grid-area:outstanding!important}
#invoiceBody>tr>td:nth-child(8),#invoiceBody>tr>td:nth-child(9),#invoiceBody>tr>td:nth-child(10){padding:7px 7px!important;border:1px solid #edf1f6!important;border-radius:8px!important;background:#f7f9fc!important;text-align:left!important;font-size:10.5px!important;font-weight:900!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#invoiceBody>tr>td:nth-child(8)::before{content:'Grand Total';display:block;font-size:6.8px;color:var(--bb-muted);font-weight:700;margin-bottom:2px;text-transform:uppercase}
#invoiceBody>tr>td:nth-child(9)::before{content:'Paid';display:block;font-size:6.8px;color:var(--bb-muted);font-weight:700;margin-bottom:2px;text-transform:uppercase}
#invoiceBody>tr>td:nth-child(10)::before{content:'Outstanding';display:block;font-size:6.8px;color:var(--bb-muted);font-weight:700;margin-bottom:2px;text-transform:uppercase}
#invoiceBody>tr>td:nth-child(9){color:var(--bb-green)!important}
#invoiceBody>tr>td:nth-child(10){color:var(--bb-red)!important}
#invoiceBody>tr>td:nth-child(11){grid-area:status!important;justify-self:end!important}
#invoiceBody .badge{font-size:8px!important;padding:4px 7px!important;white-space:nowrap!important}
#invoiceBody>tr>td:nth-child(12){grid-area:action!important;justify-self:end!important}
#invoiceBody .action-menu-btn{min-width:48px!important;height:32px!important;border:1px solid #cbd9e9!important;border-radius:8px!important;background:#f7faff!important;color:var(--bb-blue)!important;padding:0 7px!important;font-size:8.5px!important;font-weight:900!important;white-space:nowrap!important}
#invoiceBody>tr.bb-empty-row{display:block!important;padding:24px 10px!important}.bb-empty-row .empty{display:block!important;text-align:center!important;color:var(--bb-muted)!important;padding:0!important}
#floatingActionMenu{display:none!important}
/* ===== ORIGINAL INVOICE LAYOUT, MOBILE RESPONSIVE ONLY ===== */
#detailModal.modal{padding:0!important;background:#eef2f7!important;overflow:hidden!important}
#detailModal.show{display:block!important}
#detailModal .modal-card{width:100%!important;max-width:none!important;height:100dvh!important;margin:0!important;border-radius:0!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;box-shadow:none!important;background:#eef2f7!important}
#detailModal .modal-head{position:relative!important;z-index:5!important;flex:0 0 auto!important;padding:10px 11px!important;background:#fff!important;border-bottom:1px solid var(--bb-line)!important;box-shadow:0 2px 7px rgba(23,63,119,.05)!important}
#detailModal .modal-head h2{font-size:16px!important;color:var(--bb-navy)!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#detailModal .close{width:34px!important;height:34px!important;flex:0 0 34px!important}
#detailLoading{padding:24px 12px!important;text-align:center!important;font-size:11px!important}
#detailContent{flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important}
#detailModal .history-invoice-wrap{padding:6px!important;background:#eef2f7!important;overflow-x:hidden!important}
#detailModal .history-final-invoice{width:100%!important;max-width:794px!important;margin:0 auto!important}
#detailModal .history-invoice-actions{position:sticky!important;bottom:0!important;z-index:6!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important;padding:7px 6px calc(8px + env(safe-area-inset-bottom))!important;background:rgba(238,242,247,.97)!important;border-top:1px solid #d7e0ea!important;backdrop-filter:blur(8px)!important}
#detailModal .history-action-btn{min-height:42px!important;padding:5px 3px!important;border-radius:9px!important;font-size:8px!important;line-height:1.1!important;white-space:normal!important}
@media(max-width:390px){
 .main{padding:6px 6px 16px!important}.filter-grid{gap:6px!important}.field input,.field select{height:38px!important;font-size:10px!important}
 #invoiceBody>tr{padding:8px!important;column-gap:5px!important;row-gap:5px!important}#invoiceBody>tr>td:nth-child(1) .invoice-link,#invoiceBody>tr>td:nth-child(3){font-size:12px!important}#invoiceBody>tr>td:nth-child(8),#invoiceBody>tr>td:nth-child(9),#invoiceBody>tr>td:nth-child(10){padding:6px 5px!important;font-size:9.5px!important}
 #detailModal .history-action-btn{font-size:7.2px!important}
}
`;

function addMobileStyle(doc){
  let style=doc.getElementById('bb-mobile-invoices-skin');
  if(!style){style=doc.createElement('style');style.id='bb-mobile-invoices-skin';doc.head.appendChild(style)}
  style.textContent=MOBILE_CSS;
}
function enhanceFilters(doc){
  const filters=doc.querySelector('.filters');
  const summary=doc.querySelector('.summary');
  if(!filters||!summary)return;
  let backdrop=doc.getElementById('bbInvoiceFilterBackdrop');
  if(!backdrop){backdrop=doc.createElement('div');backdrop.id='bbInvoiceFilterBackdrop';backdrop.className='bb-invoice-filter-backdrop';doc.body.appendChild(backdrop)}
  if(!filters.querySelector('.bb-mobile-filter-head')){
    const head=doc.createElement('div');
    head.className='bb-mobile-filter-head';
    head.innerHTML='<div><strong>Filter Invoices</strong><span>Invoice, customer, location, date and type</span></div><button type="button" class="bb-mobile-filter-close" aria-label="Close filters">×</button>';
    filters.insertBefore(head,filters.firstChild);
  }
  let trigger=doc.getElementById('bbMobileInvoiceFilterTrigger');
  if(!trigger){
    trigger=doc.createElement('button');
    trigger.type='button';trigger.id='bbMobileInvoiceFilterTrigger';trigger.className='bb-mobile-filter-trigger';trigger.innerHTML='☷ <span>Filters</span>';
    summary.appendChild(trigger);
  }
  const open=()=>{filters.classList.add('bb-mobile-open');backdrop.classList.add('show')};
  const close=()=>{filters.classList.remove('bb-mobile-open');backdrop.classList.remove('show')};
  trigger.onclick=open;backdrop.onclick=close;
  const closeBtn=filters.querySelector('.bb-mobile-filter-close');if(closeBtn)closeBtn.onclick=close;
  [...filters.querySelectorAll('.filter-grid > .btn')].forEach(btn=>{
    if(btn.dataset.bbMobileCloseBound)return;btn.dataset.bbMobileCloseBound='1';btn.addEventListener('click',()=>setTimeout(close,60));
  });
}
function polishRows(doc){
  const body=doc.getElementById('invoiceBody');if(!body)return;
  body.querySelectorAll(':scope > tr').forEach(tr=>{
    tr.classList.toggle('bb-empty-row',!!tr.querySelector('td.empty'));
    const cells=tr.children;if(cells.length<12)return;
    const action=cells[11].querySelector('.action-menu-btn');
    const link=cells[0].querySelector('.invoice-link');
    if(action&&link&&!action.dataset.bbMobileDirect){
      action.dataset.bbMobileDirect='1';action.textContent='View ›';action.removeAttribute('onclick');
      action.onclick=e=>{e.preventDefault();e.stopPropagation();link.click()};
    }
  });
}
function watchDetail(doc){
  const modal=doc.getElementById('detailModal');if(!modal||modal.dataset.bbMobileWatch)return;
  modal.dataset.bbMobileWatch='1';
  new MutationObserver(()=>{
    if(modal.classList.contains('show')){
      const content=doc.getElementById('detailContent');if(content)setTimeout(()=>content.scrollTo({top:0,behavior:'auto'}),30);
    }
  }).observe(modal,{attributes:true,attributeFilter:['class']});
}
function enhance(doc){
  if(!doc||!doc.head||!doc.body)return;
  addMobileStyle(doc);enhanceFilters(doc);polishRows(doc);watchDetail(doc);
  const body=doc.getElementById('invoiceBody');
  if(body&&!body.dataset.bbMobileWatch){body.dataset.bbMobileWatch='1';new MutationObserver(()=>requestAnimationFrame(()=>polishRows(doc))).observe(body,{childList:true,subtree:true})}
  boot.classList.add('hide');
}
function inject(){
  let doc;try{doc=frame.contentDocument||frame.contentWindow.document}catch(_){return}
  if(!doc)return;enhance(doc);
}
frame.addEventListener('load',()=>{setTimeout(inject,90);setTimeout(inject,500);setTimeout(inject,1400)});
})();
</script>
</body>
</html>
