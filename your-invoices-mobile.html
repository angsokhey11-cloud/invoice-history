/* =========================================================
   ADD MOBILE CSS
   ========================================================= */

function addMobileStyle(doc){

  let style =
    doc.getElementById(
      'bb-mobile-invoices-skin'
    );

  if(!style){

    style =
      doc.createElement('style');

    style.id =
      'bb-mobile-invoices-skin';

    doc.head.appendChild(style);
  }

  style.textContent =
    MOBILE_CSS;
}


/* =========================================================
   FILTER BOTTOM SHEET
   ========================================================= */

function enhanceFilters(doc){

  const filters =
    doc.querySelector('.filters');

  const summary =
    doc.querySelector('.summary');

  if(!filters || !summary){
    return;
  }


  let backdrop =
    doc.getElementById(
      'bbInvoiceFilterBackdrop'
    );

  if(!backdrop){

    backdrop =
      doc.createElement('div');

    backdrop.id =
      'bbInvoiceFilterBackdrop';

    backdrop.className =
      'bb-invoice-filter-backdrop';

    doc.body.appendChild(backdrop);
  }


  if(
    !filters.querySelector(
      '.bb-mobile-filter-head'
    )
  ){

    const head =
      doc.createElement('div');

    head.className =
      'bb-mobile-filter-head';

    head.innerHTML = `
      <div>
        <strong>Filter Invoices</strong>
        <span>
          Invoice, customer, location,
          date and type
        </span>
      </div>

      <button
        type="button"
        class="bb-mobile-filter-close"
        aria-label="Close filters">
        ×
      </button>
    `;

    filters.insertBefore(
      head,
      filters.firstChild
    );
  }


  let trigger =
    doc.getElementById(
      'bbMobileInvoiceFilterTrigger'
    );

  if(!trigger){

    trigger =
      doc.createElement('button');

    trigger.type =
      'button';

    trigger.id =
      'bbMobileInvoiceFilterTrigger';

    trigger.className =
      'bb-mobile-filter-trigger';

    trigger.innerHTML =
      '☷ <span>Filters</span>';

    summary.appendChild(trigger);
  }


  const open = () => {

    filters.classList.add(
      'bb-mobile-open'
    );

    backdrop.classList.add(
      'show'
    );
  };


  const close = () => {

    filters.classList.remove(
      'bb-mobile-open'
    );

    backdrop.classList.remove(
      'show'
    );
  };


  trigger.onclick =
    open;

  backdrop.onclick =
    close;


  const closeBtn =
    filters.querySelector(
      '.bb-mobile-filter-close'
    );

  if(closeBtn){
    closeBtn.onclick = close;
  }


  [
    ...filters.querySelectorAll(
      '.filter-grid > .btn'
    )
  ].forEach(btn => {

    if(
      btn.dataset
        .bbMobileCloseBound
    ){
      return;
    }

    btn.dataset
      .bbMobileCloseBound = '1';

    btn.addEventListener(
      'click',
      () => {
        setTimeout(
          close,
          80
        );
      }
    );
  });
}


/* =========================================================
   MOBILE INVOICE CARDS
   ========================================================= */

function polishRows(doc){

  const body =
    doc.getElementById(
      'invoiceBody'
    );

  if(!body){
    return;
  }


  body
    .querySelectorAll(
      ':scope > tr'
    )
    .forEach(tr => {

      tr.classList.toggle(
        'bb-empty-row',
        !!tr.querySelector(
          'td.empty'
        )
      );


      const cells =
        tr.children;

      if(cells.length < 12){
        return;
      }


      const action =
        cells[11]
          .querySelector(
            '.action-menu-btn'
          );

      const link =
        cells[0]
          .querySelector(
            '.invoice-link'
          );


      if(
        action &&
        link &&
        !action.dataset.bbMobileDirect
      ){

        action.dataset
          .bbMobileDirect = '1';

        action.textContent =
          'View ›';

        action.removeAttribute(
          'onclick'
        );

        action.onclick =
          event => {

            event.preventDefault();
            event.stopPropagation();

            link.click();
          };
      }
    });
}


/* =========================================================
   FIT ORIGINAL INVOICE TO PHONE
   ========================================================= */

function fitInvoicePreview(doc){

  const modal =
    doc.getElementById(
      'detailModal'
    );

  if(
    !modal ||
    !modal.classList.contains('show')
  ){
    return;
  }


  const wrap =
    modal.querySelector(
      '.history-invoice-wrap'
    );

  const invoice =
    modal.querySelector(
      '.history-final-invoice'
    );

  if(!wrap || !invoice){
    return;
  }


  let stage =
    wrap.querySelector(
      '.bb-history-preview-stage'
    );


  if(!stage){

    stage =
      doc.createElement('div');

    stage.className =
      'bb-history-preview-stage';

    invoice.parentNode
      .insertBefore(
        stage,
        invoice
      );

    stage.appendChild(invoice);

  }else if(
    invoice.parentNode !== stage
  ){

    stage.appendChild(invoice);
  }


  const BASE_WIDTH = 794;


  const availableWidth =
    Math.max(
      260,
      wrap.clientWidth
    );


  const scale =
    Math.min(
      1,
      availableWidth / BASE_WIDTH
    );


  stage.style.setProperty(
    '--bb-invoice-scale',
    String(scale)
  );


  /*
   * offsetHeight is the original
   * unscaled 794px invoice height.
   */
  const naturalHeight =
    Math.max(
      invoice.offsetHeight,
      invoice.scrollHeight,
      1
    );


  stage.style.height =
    Math.ceil(
      naturalHeight * scale
    ) + 'px';


  stage.style.width =
    Math.ceil(
      BASE_WIDTH * scale
    ) + 'px';


  stage.style.marginLeft =
    'auto';

  stage.style.marginRight =
    'auto';
}


/* =========================================================
   WATCH INVOICE PREVIEW
   ========================================================= */

function watchDetail(doc){

  const modal =
    doc.getElementById(
      'detailModal'
    );

  if(
    !modal ||
    modal.dataset.bbMobileWatch
  ){
    return;
  }


  modal.dataset
    .bbMobileWatch = '1';


  const childWindow =
    frame.contentWindow;


  let fitTimer = null;


  const runFit = () => {

    clearTimeout(fitTimer);

    fitTimer =
      setTimeout(
        () => {

          childWindow
            .requestAnimationFrame(
              () => {

                fitInvoicePreview(doc);

                const content =
                  doc.getElementById(
                    'detailContent'
                  );

                if(content){
                  content.scrollTop = 0;
                }
              }
            );

        },
        45
      );
  };


  /*
   * Modal open / close
   */
  new childWindow
    .MutationObserver(
      () => {

        if(
          modal.classList
            .contains('show')
        ){

          runFit();

          setTimeout(
            () =>
              fitInvoicePreview(doc),
            180
          );

          setTimeout(
            () =>
              fitInvoicePreview(doc),
            500
          );
        }
      }
    )
    .observe(
      modal,
      {
        attributes:true,
        attributeFilter:[
          'class'
        ]
      }
    );


  /*
   * Invoice HTML gets rebuilt
   * after invoice detail loads.
   */
  const printArea =
    doc.getElementById(
      'historyInvoicePrintArea'
    );

  if(printArea){

    new childWindow
      .MutationObserver(
        () => {

          if(
            modal.classList
              .contains('show')
          ){

            runFit();

            setTimeout(
              () =>
                fitInvoicePreview(doc),
              120
            );
          }
        }
      )
      .observe(
        printArea,
        {
          childList:true,
          subtree:true
        }
      );
  }


  /*
   * Detail loading state change
   */
  const detailContent =
    doc.getElementById(
      'detailContent'
    );

  if(detailContent){

    new childWindow
      .MutationObserver(
        runFit
      )
      .observe(
        detailContent,
        {
          attributes:true,
          childList:true,
          subtree:true
        }
      );
  }


  childWindow
    .addEventListener(
      'resize',
      () => {

        fitInvoicePreview(doc);
      }
    );
}


/* =========================================================
   WATCH INVOICE LIST
   ========================================================= */

function observeRows(doc){

  const body =
    doc.getElementById(
      'invoiceBody'
    );

  if(
    !body ||
    body.dataset.bbMobileObserved
  ){
    return;
  }


  body.dataset
    .bbMobileObserved = '1';


  new frame.contentWindow
    .MutationObserver(
      () => {

        frame.contentWindow
          .requestAnimationFrame(
            () => {

              polishRows(doc);
            }
          );
      }
    )
    .observe(
      body,
      {
        childList:true,
        subtree:true
      }
    );
}


/* =========================================================
   INJECT MOBILE SKIN
   ========================================================= */

function inject(){

  let doc;

  try{

    doc =
      frame.contentDocument ||
      frame.contentWindow.document;

  }catch(error){

    return;
  }


  if(
    !doc ||
    !doc.head ||
    !doc.body
  ){
    return;
  }


  addMobileStyle(doc);

  enhanceFilters(doc);

  polishRows(doc);

  observeRows(doc);

  watchDetail(doc);


  setTimeout(
    () => {

      polishRows(doc);

      fitInvoicePreview(doc);

    },
    120
  );


  setTimeout(
    () => {

      polishRows(doc);

      fitInvoicePreview(doc);

    },
    600
  );


  boot.classList.add(
    'hide'
  );
}


/* =========================================================
   LOAD
   ========================================================= */

frame.addEventListener(
  'load',
  () => {

    setTimeout(
      inject,
      80
    );

    setTimeout(
      inject,
      450
    );

    setTimeout(
      inject,
      1200
    );
  }
);

})();
