<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Your Invoices</title>
<style>html,body{margin:0;min-height:100%;background:#eef3f8;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Your Invoices…<div class="bb-sub">Current Permanent Salesman locations only</div></div></div>
<script>
(async function(){
  try{
    const r=await fetch('legacy-google-v4.6.3.html?v=20260925-rowpreview1',{cache:'no-store'});
    if(!r.ok)throw new Error('Could not load Your Invoices source.');
    let html=await r.text();

    const mobileRoleScope=new URLSearchParams(location.search).get('mobileRoleScope')==='1';
    const adapterFile=mobileRoleScope
      ? 'supabase-history-mobile-adapter.js?v=20260925-assigned1'
      : 'supabase-your-invoices-adapter.js?v=20260921-owner1';
    const adapterObject=mobileRoleScope
      ? 'BBHistoryMobileAdapter'
      : 'BBYourInvoicesAdapter';
    const adapter='<scr'+'ipt src="'+adapterFile+'"></scr'+'ipt>';
    const privacyStyle='<style>.floating-action-menu .edit,.floating-action-menu .danger{display:none!important}</style>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Your Invoices source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+privacyStyle+'\n'+html.slice(headClose);

    const marker='(async function initializeInvoiceHistory() {';
    const replacement=`
      fetchApi = window[${JSON.stringify(adapterObject)}].fetchApi;
      historyJsonp = window[${JSON.stringify(adapterObject)}].historyJsonp;
      postHistoryAction = window[${JSON.stringify(adapterObject)}].postHistoryAction;
      requireHistoryPrimaryAdmin = window[${JSON.stringify(adapterObject)}].requirePrimaryAdmin;
      ${marker}`;
    if(!html.includes(marker))throw new Error('Your Invoices initialization marker was not found.');
    html=html.replace(marker,replacement);

    html=html.replace('https://angsokhey11-cloud.github.io/big-brother-dashboard/?module=history','https://angsokhey11-cloud.github.io/big-brother-dashboard/?module=sales-support-your-invoices&autoload=1');
    html=html.replace('<title>BIG BROTHER — Invoice History Workspace</title>','<title>BIG BROTHER — Your Invoices</title>');
    html=html.replace('<h1 class="page-title">Invoice History</h1>','<h1 class="page-title">🧾 Your Invoices</h1>');
    html=html.replace('Search and review saved sales invoices.','Invoice history follows the current Permanent Salesman assigned to each Location.');
    html=html.replace('<div class="system-pill">SALES DATABASE</div>','<div class="system-pill">PERMANENT SALESMAN · LOCATION RESPONSIBILITY</div>');
    html=html.replaceAll('Sales Database','BIG BROTHER Database');

    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Your Invoices<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body></html>
