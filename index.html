<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Invoice History</title>
<style>html,body{margin:0;min-height:100%;background:#eef3f8;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Invoice History…<div class="bb-sub">Secure Supabase database</div></div></div>
<script>
(async function(){
  try{
    const r=await fetch('legacy-google-v4.6.3.html?v=20261004-bank-transaction1',{cache:'no-store'});
    if(!r.ok)throw new Error('Could not load Invoice History source.');
    let html=await r.text();
    const digitalResponse=await fetch('history-digital-original-v1.js?v=20261005-digital-dialog1',{cache:'no-store'});
    if(!digitalResponse.ok)throw new Error('Could not load Digital Original helper.');
    const digitalJs=await digitalResponse.text();


    // Load the Supabase adapter before the legacy page scripts execute.
    const adapter='<scr'+'ipt src="supabase-history-adapter.js?v=20261005-digital-session1"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Invoice History source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'
      +'<scr'+'ipt src="https://angsokhey11-cloud.github.io/big-brother-dashboard/bb-system-dialog-v1.js?v=20261005-dialog2"></scr'+'ipt>\n'
      +html.slice(headClose);

    // Rebind database functions immediately before the page initializes.
    const marker='(async function initializeInvoiceHistory() {';
    const replacement=`${marker}
      try {
        // Initializing Invoice History must wait for its external adapter.
        let adapter=null;
        for(let i=0;i<60;i++){
          adapter=window.BBHistoryAdapter;
          if(adapter?.fetchApi)break;
          await new Promise(resolve=>setTimeout(resolve,150));
        }
        if(!adapter?.fetchApi)throw Error("Invoice History database connection did not initialize.");
        fetchApi=adapter.fetchApi;
        historyJsonp=adapter.historyJsonp;
        postHistoryAction=adapter.postHistoryAction;
        requireHistoryPrimaryAdmin=adapter.requirePrimaryAdmin;
        const originalMasterLookup=historyJsonp;
        historyJsonp=async function(url,params){
          if(params?.action!=="getLocations")return originalMasterLookup(url,params);
          // A slow auxiliary location dropdown must not block the invoice list.
          return Promise.race([originalMasterLookup(url,params),
            new Promise(resolve=>setTimeout(()=>resolve([]),9000))]);
        };
      `;
    if(!html.includes(marker))throw new Error('Invoice History initialization marker was not found.');
    html=html.replace(marker,replacement);
    const initTail='    startHistorySmartSync();\n  })();';
    if(!html.includes(initTail))throw Error('Invoice History final initialization marker missing.');
    html=html.replace(initTail,
      '    startHistorySmartSync();\n  } catch(error) { console.error("Invoice History startup:",error);'+
      ' const message=String(error?.message||error);'+
      ' const loader=document.getElementById("loading");'+
      ' if(loader)loader.textContent="Cannot load invoices: "+message;'+
      ' const table=document.getElementById("invoiceBody");'+
      ' if(table)table.innerHTML=\'<tr><td colspan="13" class="empty">Could not load Invoice History. Press Search to retry.</td></tr>\';'+
      ' } })();'
    );


    // Allow a real standalone Invoice History URL for troubleshooting/admin work.
    // The legacy source normally redirects top-level opens back to Dashboard.
    html=html.replace(
      'const bbExactPreview = !!(bbPreviewParams.get("previewInvoiceNo") || bbPreviewParams.get("previewInvoiceId"));',
      'const bbExactPreview = !!(bbPreviewParams.get("previewInvoiceNo") || bbPreviewParams.get("previewInvoiceId")); const bbStandalone = bbPreviewParams.get("standalone")==="1";'
    );
    html=html.replace(
      'if (window.top === window.self && !bbExactPreview) {',
      'if (window.top === window.self && !bbExactPreview && !bbStandalone) {'
    );


    if(new URLSearchParams(location.search).get('standalone')==='1'){
      html=html.replace('</head>',
        '<style id="bbStandaloneHistory">.sidebar{display:none!important}.main{margin-left:0!important;width:100%!important;max-width:1500px!important;margin-right:auto!important;margin-left:auto!important}.brand{display:none!important}@media(max-width:720px){.main{width:100%!important;margin:0!important}}</style></head>');
    }

    html=html.replaceAll('Sales Database','BIG BROTHER Database');
    html=html.replace('<title>BIG BROTHER — Invoice History Workspace</title>','<title>BIG BROTHER — Invoice History Supabase</title>');

    // Credit invoices only: show the Digital Original action after a fresh
    // server check. No button appears on cash/bank or paid invoice previews.
    const detailAction='<button type="button" class="history-action-btn history-save-btn" id="bbSaveDigitalOriginal" hidden onclick="window.BBDigitalOriginal.save()">📄 Save as Digital Original</button><span id="bbDigitalOriginalBadge" hidden style="padding:8px 10px;border-radius:8px;background:#ecf8f0;color:#207148;font-size:12px;font-weight:800"></span>';
    const actionAnchor='<button type="button" class="history-action-btn history-telegram-btn" onclick="shareHistoryInvoiceToTelegram(event)">✈️ Share to Telegram</button>';
    if(!html.includes(actionAnchor))throw Error('Invoice preview action anchor not found');
    html=html.replace(actionAnchor,actionAnchor+detailAction);
    html=html.replace('</head>','<style>#bbSaveDigitalOriginal[hidden],#bbDigitalOriginalBadge[hidden]{display:none!important}#bbDigitalOriginalBadge{grid-column:1/-1}.history-invoice-actions:has(#bbSaveDigitalOriginal:not([hidden])){grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}@media(max-width:600px){.history-invoice-actions:has(#bbSaveDigitalOriginal:not([hidden])){grid-template-columns:1fr}}</style></head>');



    // The print-preview HTML also contains a literal </body> in a template.
    // Insert at the document's LAST closing body tag, never inside its scripts.
    const finalBodyClose=html.toLowerCase().lastIndexOf('</body>');
    if(finalBodyClose<0)throw Error('Invoice History document body closing tag missing.');
    html=html.slice(0,finalBodyClose)
      +'<scr'+'ipt>'+digitalJs.replaceAll('</scr'+'ipt>','<\\/script>')+'</scr'+'ipt>'
      +html.slice(finalBodyClose);
    // Exact preview mode: Batch Selling Tracker already supplies the outer modal.
    // Strip Invoice History's own page/modal chrome so only the live invoice is visible.
    const exactPreviewParams=new URLSearchParams(location.search);
    const exactPreviewMode=!!(exactPreviewParams.get('previewInvoiceNo')||exactPreviewParams.get('previewInvoiceId'));
    if(exactPreviewMode){
      const exactHead=html.toLowerCase().lastIndexOf('</head>');
      if(exactHead<0)throw Error('Invoice History head missing for exact preview mode.');
      const exactCss='<style id="bbExactPreviewStyle">'
        +'html,body{margin:0!important;min-height:100%!important;background:#eef3f8!important;overflow:auto!important}'
        +'.main,.sidebar,#floatingActionMenu,#editModal{display:none!important}'
        +'#detailModal.modal{position:static!important;inset:auto!important;display:block!important;background:transparent!important;padding:0!important;overflow:visible!important;z-index:auto!important}'
        +'#detailModal .modal-card{width:100%!important;max-width:none!important;max-height:none!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;overflow:visible!important}'
        +'#detailModal .modal-head,.history-invoice-actions{display:none!important}'
        +'#detailLoading{min-height:240px!important;display:flex;align-items:center;justify-content:center;background:#eef3f8!important}'
        +'#detailContent{margin:0!important;padding:0!important}'
        +'.history-invoice-wrap{padding:10px!important;background:#eef3f8!important;overflow:hidden!important}'
        +'</style>';
      html=html.slice(0,exactHead)+exactCss+html.slice(exactHead);
    }

    // Allow other BIG BROTHER modules to open the existing live Invoice History preview directly.
    // No preview image is generated or stored by this route.
    const directPreviewBody=html.toLowerCase().lastIndexOf('</body>');
    if(directPreviewBody<0)throw Error('Invoice History body closing tag missing for direct preview.');
    html=html.slice(0,directPreviewBody)
      +'<scr'+'ipt>(function(){const p=new URLSearchParams(location.search);const no=p.get("previewInvoiceNo")||"";const id=p.get("previewInvoiceId")||"";if(!no&&!id)return;let tries=0;const timer=setInterval(()=>{tries++;if(typeof window.openDetail==="function"){clearInterval(timer);window.openDetail(no,id);return;}if(tries>=120)clearInterval(timer);},150);})();</scr'+'ipt>'
      +html.slice(directPreviewBody);

    // Desktop-only fitted preview. Keep the original A4 document unchanged.
    
    const fitBody=html.toLowerCase().lastIndexOf('</body>');
    if(fitBody<0)throw Error('Invoice History body closing tag missing for preview fit.');
    html=html.slice(0,fitBody)
      +'<scr'+'ipt src="history-desktop-fit-preview-v1.js?v=20261002-headerbig2"></scr'+'ipt>'
      +html.slice(fitBody);
    
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Invoice History<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body></html>
